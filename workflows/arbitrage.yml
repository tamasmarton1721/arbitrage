name: Arbitrage Scanner

on:
  schedule:
    # Minden 15. percben fut. A GitHub ennél sűrűbb/pontosabb ütemezést
    # nem garantál (terheléstől függően csúszhat néhány percet).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lehetővé teszi a kézi indítást is az Actions fülön

permissions:
  contents: write  # kell ahhoz, hogy a workflow visszaírhassa a CSV-t a repóba

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Szkenner futtatása
        run: python arbitrage_bot_single_run.py

      - name: CSV visszacommitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arbitrage_opportunities.csv
          git diff --staged --quiet || git commit -m "Arbitrázs log frissítve [skip ci]"
          git push
